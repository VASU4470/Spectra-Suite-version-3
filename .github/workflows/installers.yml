name: Installer candidates

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
          - os: macos-14
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
          - os: ubuntu-22.04
            target: linux-amd64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libfontconfig1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-xinerama0 libdbus-1-3
      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyflakes
      - name: Verify source and scientific/GUI regressions
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: QtAgg
          SPECTRASUITE_DISABLE_UPDATE_CHECK: "1"
        run: |
          python -m compileall -q .
          python -m pyflakes .
          python -m unittest discover -s tests -v
      - name: Record exact source commit
        shell: bash
        run: |
          echo "BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build and test installed application
        run: python packaging/build_installers.py
      - name: Preserve verified installer candidates
        uses: actions/upload-artifact@v4
        with:
          name: SpectraSuite-candidate-${{ matrix.target }}
          path: release-dist/*
          if-no-files-found: error
          retention-days: 30
