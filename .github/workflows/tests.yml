name: Cross-platform tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-and-build:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyflakes

      - name: Compile and lint
        run: |
          python -m compileall -q .
          python -m pyflakes .

      - name: Run PySide6 GUI smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: QtAgg
        run: python -m unittest discover -s tests -v

      - name: Build application with PyInstaller
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir
          --name SpectraSuite-CI --add-data "icon.png:."
          --add-data "ir_icon.png:." --add-data "xrd_icon.png:." launcher.py

      - name: Run the packaged startup check
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: QtAgg
        shell: python
        run: |
          import os
          import subprocess
          from pathlib import Path

          executable = Path("dist/SpectraSuite-CI/SpectraSuite-CI")
          if os.name == "nt":
              executable = executable.with_suffix(".exe")
          subprocess.run([str(executable.resolve()), "--smoke-test"], check=True)
