name: Publish verified test installers

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Cross-platform tests", "Installer candidates"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: spectrasuite-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Verify tested artifacts and publish the new test release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python3 packaging/publish_test_installers.py
